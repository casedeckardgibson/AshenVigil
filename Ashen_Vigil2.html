  if(e.hp<=0)return defeat(e);

function hitFoe(e,n,col,crit){e.hp=Math.max(0,e.hp-n);flash(e.mesh,col);burst(epos(e),col,crit?36:22,crit?6:4);shake(crit?.4:.22);pop((crit?'CRIT ':'')+n,epos(e).add(V(0,.9,0)),crit?'crit':'dmg');snd(crit?240:180,.18,'sawtooth',.1,-110);foeUI()}
async function act(a,e){
 const dx=e.b.position.x-pb.position.x,dz=e.b.position.z-pb.position.z,dh=Math.hypot(dx,dz),n=V(dx/dh,0,dz/dh),reach=dh-1.9,A=H;animLock=true;
 if(a==='attack'){snd(300,.2,'triangle',.06,400);
  await tween(280,x=>{hOff.copy(n).multiplyScalar(reach*x);A.ar.rotation.x=-2.7*x;A.al.rotation.x=-.4*x;A.ll.rotation.x=.5*x;A.lr.rotation.x=-.5*x});
  const crit=Math.random()<.18,dmg=Math.round((rnd(13,19)+P.atk)*(crit?1.6:1));
  await tween(110,x=>{A.ar.rotation.x=-2.7+3.4*x});hitFoe(e,dmg,0xffc87a,crit);
  await tween(300,x=>{hOff.copy(n).multiplyScalar(reach*(1-x));A.ar.rotation.x=.7-.95*x;A.al.rotation.x=-.4*(1-x);A.ll.rotation.x=.5*(1-x);A.lr.rotation.x=-.5*(1-x)})}
 else if(a==='skill'){P.mp-=P.cost;hudUI();snd(500,.6,'sine',.08,500);
  await tween(380,x=>{ /* charge */ });
  const orb=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),new THREE.MeshBasicMaterial({color:0xc9a8ff,blending:THREE.AdditiveBlending,transparent:true}));S.add(orb);
  const from=hpos().add(V(0,.3,0));const to=epos(e).add(V(0,.3,0));
  await tween(400,x=>{orb.position.lerpVectors(from,to,x);orb.position.y+=Math.sin(x*Math.PI)*.7;burst(orb.position,0xa27bff,1,.8,0)},x=>x);
  S.remove(orb);hitFoe(e,rnd(24,32)+P.atk,0xb68cff,false);burst(epos(e),0xe0ccff,40,7);snd(160,.4,'sawtooth',.1,-100);
  await tween(320,x=>{ /* recover */ })}

 else{P.pot--;P.hp=Math.min(P.maxhp,P.hp+40);hudUI();snd(700,.5,'sine',.06,500);burst(hpos(),0x7dffb0,28,2.5,-3);pop('+40',hpos().add(V(0,1,0)),'heal');await wait(650)}
 animLock=false;hOff.set(0,0,0)}
async function strike(e){
 const heavy=Math.random()<(e.d.boss?.4:.28),dx=pb.position.x-e.b.position.x,dz=pb.position.z-e.b.position.z,dh=Math.hypot(dx,dz),n=V(dx/dh,0,dz/dh),reach=dh-1.9;
 if(heavy){pop('Charging…',epos(e).add(V(0,1.4,0)),'info');flash(e.mesh,0xff8a2a,700);snd(100,.7,'sawtooth',.07,120);await tween(700,x=>e.off.set(0,x*.4,0))}

 let dmg=rnd(e.d.dmg[0],e.d.dmg[1])*(heavy?1.7:1);dmg=Math.round(P.guard?dmg*.35:dmg);P.hp=Math.max(0,P.hp-dmg);hudUI();
 flash(hero,0xff3a5a);burst(hpos(),P.guard?0x7ab8ff:0xff4a6a,24,5);shake(heavy?.6:.32);hurt();snd(130,.25,'sawtooth',.12,-70);pop((P.guard?'Blocked ':'')+dmg,hpos().add(V(0,1.1,0)),'hit');
 await tween(300,x=>e.off.set(n.x*reach*(1-x),0,n.z*reach*(1-x)));H.shield.visible=false;H.shield.material.opacity=0}
async function defeat(e){snd(120,.6,'sawtooth',.12,-80);burst(epos(e),e.d.eye,50,7);await tween(750,x=>{e.mesh.scale.setScalar(e.d.s*(1-x)+.001);e.off.y=x*1.3});
 e.dead=true;S.remove(e.mesh);W.removeBody(e.b);left--;$('foe').classList.remove('on');
 if(e.d.boss){await say([{n:'The Gatekeeper',t:'The door… opens. Four hundred years, and it is a flame that ends it.'},{n:'Lira',t:"Whatever waits behind it, I'm ready."}]);objUI();
  door.material.opacity=1;shake(.5);return overlay('VIGIL COMPLETE','The seal is broken and the stars fall silent. Your journey continues beyond the door.','Play Again',()=>location.reload())}
 P.hp=Math.min(P.maxhp,P.hp+15);P.mp=Math.min(P.maxmp,P.mp+10);hudUI();pop('Victory  +15 HP  +10 MP',hpos().add(V(0,1.3,0)),'heal');banner('Guardian Defeated');endScene()}
async function lose(){banner('Defeated');animLock=true;await tween(800,x=>{hero.rotation.z=-1.45*x;hOff.y=-.35*x});$('foe').classList.remove('on');await wait(600);overlay('FALLEN','The vigil claims another flame.','Rise Again',()=>location.reload())}
function overlay(h,p,b,fn,extra=''){const o=$('ov');o.innerHTML=`<h1>${h}</h1><p>${p}</p><button id="ob">${b}</button>${extra}`;o.classList.add('on');$('ob').onclick=fn}

// ---------- input ----------
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
 if(st==='dialogue'&&['Space','Enter','KeyE'].includes(e.code)&&dlgNext)dlgNext();
 if(st==='combat'&&e.code>='Digit1'&&e.code<='Digit4')choose(['attack','skill','guard','potion'][+e.code.slice(5)-1])});
addEventListener('keyup',e=>keys[e.code]=0);
$('c').addEventListener('click',()=>{if(st==='explore'&&!document.pointerLockElement){try{const p=$('c').requestPointerLock();p&&p.catch&&p.catch(()=>{})}catch(e){}}});
addEventListener('mousemove',e=>{if(st!=='explore')return;if(document.pointerLockElement||e.buttons&1){yaw-=(e.movementX||0)*.0027;pitch=Math.min(.6,Math.max(-.1,pitch+(e.movementY||0)*.002))}});

// ---------- update ----------
function updateHero(dt){
 const vx=pb.velocity.x,vz=pb.velocity.z;
 if(st==='explore'){
  const mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),mz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  yaw+=((keys.KeyQ?1:0)-(keys.KeyE?1:0))*1.8*dt;
  const f=V(-Math.sin(yaw),0,-Math.cos(yaw)),r=V(Math.cos(yaw),0,-Math.sin(yaw)),d=f.multiplyScalar(mz).add(r.multiplyScalar(mx));let tx=0,tz=0;
  if(d.lengthSq()>0){d.normalize();tx=d.x*5.2;tz=d.z*5.2;hero.face=Math.atan2(d.x,d.z)}
  const k=Math.min(1,dt*(tx||tz?12:9));pb.velocity.x+=(tx-vx)*k;pb.velocity.z+=(tz-vz)*k;
  if(keys.Space&&ground>0){pb.velocity.y=9.2;ground=0;snd(420,.12,'triangle',.05,200)}
 }else{pb.velocity.x*=.8;pb.velocity.z*=.8}
 if(pb.position.y<-8){pb.position.set(0,1,6);pb.velocity.set(0,0,0)}
 const sp=st==='explore'?Math.hypot(pb.velocity.x,pb.velocity.z):0;let bob=0;
 // Idle bounce + walk bob
 const k = Math.min(1, sp / 4.5);
 if(!animLock) ph += sp * dt * 2.1;
 // Subtle looping idle bounce (always on, stronger when standing still)
 const idleBounce = Math.sin(t * 2.4) * 0.028 * (1 - k * 0.7);
 const walkBob = animLock ? 0 : Math.abs(Math.sin(ph)) * 0.04 * k;
 bob = idleBounce + walkBob;
 // Keep logical facing for movement/combat
 hero.rotation.y = lerpA(hero.rotation.y, hero.face, 1 - Math.exp(-dt * 14));
 // Billboard the sprite plane to always face camera (Y only), pick directional texture
 if(H.sprite){
   let view = ((yaw - hero.face) % TAU + TAU) % TAU;
   let dir;
   if(view < Math.PI * 0.25 || view > Math.PI * 1.75) dir = 'front';
   else if(view > Math.PI * 0.75 && view < Math.PI * 1.25) dir = 'back';
   else if(view >= Math.PI * 0.25 && view <= Math.PI * 0.75) dir = 'left';
   else dir = 'right';
   if(dir !== H.dir){
     H.dir = dir;
     H.sprite.material = H.mats[dir];
     // Correct width for this texture's aspect so front is not squished
     const a = H.aspects[dir];
     H.sprite.scale.set(a * 2.05, 2.05, 1);
   }
   // Y-billboard: face the camera while staying upright
   const dx = cam.position.x - hero.position.x;
   const dz = cam.position.z - hero.position.z;
   H.sprite.rotation.y = Math.atan2(dx, dz) - hero.rotation.y;
 }
 hero.position.set(pb.position.x + hOff.x, pb.position.y - 0.05 + hOff.y + bob, pb.position.z + hOff.z);
}
function updateEnemies(dt){for(const e of enemies){if(e.dead)continue;e.hv=Math.sin(t*2+e.seed)*.07+.18;
 let tx=0,tz=0;const dx=pb.position.x-e.b.position.x,dz=pb.position.z-e.b.position.z,dist=Math.hypot(dx,dz)||1;
 if(st==='explore'){
  if(e.state==='idle'){
   if(dist<e.d.aggro&&Math.abs(pb.position.y-e.b.position.y)<3.3){e.state='chase';pop('!',V(e.b.position.x,e.b.position.y+2.4*e.d.s,e.b.position.z),'alert');snd(140,.3,'sawtooth',.08,-60)}
   else if(!e.d.boss){e.wt-=dt;if(e.wt<0){e.wt=2+Math.random()*3;e.wa=Math.random()<.4?null:Math.random()*TAU}let a=e.wa;const hx=e.hx-e.b.position.x,hz=e.hz-e.b.position.z;if(Math.hypot(hx,hz)>4)a=Math.atan2(hx,hz);if(a!=null){tx=Math.sin(a)*1.1;tz=Math.cos(a)*1.1;e.face=a}}
  }else if(dist>e.d.aggro*2.2)e.state='idle';
  else{const sp=e.d.boss?2.7:3.3;tx=dx/dist*sp;tz=dz/dist*sp;e.face=Math.atan2(dx,dz);if(dist<2.8&&!busy)engage(e)}}
 const k=Math.min(1,dt*8);e.b.velocity.x+=(tx-e.b.velocity.x)*k;e.b.velocity.z+=(tz-e.b.velocity.z)*k;
 e.mesh.rotation.y=lerpA(e.mesh.rotation.y,e.face,1-Math.exp(-dt*10));e.ring.rotation.z+=dt*1.6;
 e.mesh.position.set(e.b.position.x+e.off.x,e.b.position.y-.45+e.hv+e.off.y,e.b.position.z+e.off.z)}}
const camPos=V(0,3,10),camLook=V();
function updateCam(dt){let pos,look,sp=18;
 if(st==='title'){const a=Math.sin(t*.25)*.9;pos=V(pb.position.x+Math.sin(a)*4.6,2.1,pb.position.z-Math.cos(a)*4.6);look=V(pb.position.x,1.4,pb.position.z);sp=3}
 else if(cur&&(st==='combat'||st==='dialogue')){const e=cur,hp=hpos().add(V(0,.05,0)),ep=epos(e),d=V(ep.x-hp.x,0,ep.z-hp.z).normalize(),r=V(-d.z,0,d.x);
  pos=hp.clone().addScaledVector(d,-3).addScaledVector(r,.95).add(V(0,.8,0));look=hp.clone().lerp(ep,.8).addScaledVector(r,.1).add(V(0,.15,0));sp=4}
 else{const D=3.7,cp=Math.cos(pitch),sn=Math.sin(pitch),piv=V(pb.position.x,pb.position.y+.95,pb.position.z),f=V(-Math.sin(yaw),0,-Math.cos(yaw)),r=V(Math.cos(yaw),0,-Math.sin(yaw));
  pos=piv.clone().addScaledVector(f,-cp*D).addScaledVector(r,.8).add(V(0,sn*D+.35,0));look=piv.clone().addScaledVector(r,.8).addScaledVector(f,5*cp).add(V(0,-sn*5+.3,0));sp=st==='explore'?18:4}
 const k=1-Math.exp(-dt*sp);camPos.lerp(pos,k);camLook.lerp(look,k);shakeA*=Math.exp(-dt*7);
 cam.position.set(camPos.x+(Math.random()-.5)*shakeA,camPos.y+(Math.random()-.5)*shakeA,camPos.z+(Math.random()-.5)*shakeA);cam.lookAt(camLook);sky.position.copy(cam.position)}
function updateFx(dt){
 for(let i=fx.length-1;i>=0;i--){const m=fx[i],u=m.userData;u.l-=dt;if(u.l<=0){S.remove(m);m.material.dispose();fx.splice(i,1);continue}u.v.y-=u.g*dt;m.position.addScaledVector(u.v,dt);m.material.opacity=u.l/u.l0;m.scale.setScalar(.4+u.l/u.l0)}
 for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;const v=p.p.clone();v.y+=p.t*.9;v.project(cam);
  if(p.t>1.3){p.el.remove();pops.splice(i,1);continue}p.el.style.opacity=v.z>1?0:Math.min(1,(1.3-p.t)*2.5);p.el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`}
 const a=mg.attributes.position.array;for(let i=0;i<MN;i++){a[i*3+1]+=dt*.25;a[i*3]+=Math.sin(t+i)*dt*.1;if(a[i*3+1]>9)a[i*3+1]=0}mg.attributes.position.needsUpdate=true;
 crys.forEach((c,i)=>{c.rotation.y+=dt*.8;c.position.y=1.7+Math.sin(t*1.5+i)*.12});runes.rotation.y+=dt*.2;
 if(left>0)door.material.opacity=.4+Math.sin(t*2)*.1;for(const c of crates){c.o.position.copy(c.b.position);c.o.quaternion.copy(c.b.quaternion)}}

const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);t+=dt;
 W.step(1/60,dt,3);ground-=dt;for(const c of W.contacts){if(c.bi===pb||c.bj===pb){const ny=c.bi===pb?-c.ni.y:c.ni.y;if(ny>.5)ground=.12}}
 updateHero(dt);updateEnemies(dt);updateCam(dt);updateFx(dt);ren.render(S,cam)}
hudUI();objUI();loop();
overlay('ASHEN VIGIL','A moonlit ruin. Four guardians. One sealed door.','Begin',()=>{$('ov').classList.remove('on');snd(440,.3,'sine',.08,220);intro()},
